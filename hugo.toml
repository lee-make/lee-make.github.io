baseURL = 'https://lee-make.github.io/'
title = '我的博客'
defaultContentLanguage = 'zh-CN'
hasCJKLanguage = true
enableRobotsTXT = true
theme = 'reimu'

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
guessSyntax = true
noClasses = false

# 站内搜索：生成 public/index.json 供搜索页使用
[outputs]
  home = ['HTML', 'RSS', 'JSON']

[languages]
  [languages.zh-CN]
    label = '简体中文'
    weight = 1
  [languages.zh-TW]
    label = '繁體中文'
    weight = 2
